<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Office Cast — キャラクター設定</title>
<link rel="stylesheet" href="../shared/styles/base.css">
<style>
  .stage { background: var(--paper); }
  .eyebrow { position: absolute; left: 80px; top: 54px; font: 600 15px Inter; letter-spacing: .32em; color: var(--muted); }
  h1 { position: absolute; left: 76px; top: 78px; margin: 0; font: 900 50px Zen; letter-spacing: .02em; }
  .meta { position: absolute; right: 80px; top: 92px; font: 500 15px Inter; letter-spacing: .2em; color: var(--muted); text-align: right; line-height: 1.7; }
  .rule { position: absolute; left: 80px; right: 80px; height: 2px; background: var(--ink); }
  .rule.thin { height: 1px; background: #cfc9bf; }
  .sec { position: absolute; font: 600 13px Inter; letter-spacing: .28em; color: var(--muted); }
  .sec b { font: 700 18px Zen; letter-spacing: .06em; color: var(--ink); margin-right: 14px; }
  .name { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .name b { display: block; font: 700 20px Zen; }
  .name span { display: block; font: 500 12px Inter; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }
  .card { position: absolute; overflow: hidden; background: #f5f2ed; border-radius: 6px; }
  .card .char { position: absolute; }
  .cap { position: absolute; transform: translateX(-50%); font: 500 12px Inter; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .vline { position: absolute; width: 1px; background: #cfc9bf; }
  .floor { position: absolute; height: 1px; background: #d8d2c8; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="eyebrow">CHARACTER SHEET</div>
  <h1>会社員と汎用ロボット</h1>
  <div class="meta">OFFICE CAST / SHU WORKS<br>FLAT / NO OUTLINE / 5.2 HEADS</div>
  <div class="rule" style="top:160px"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../shared/characters/common.js"></script>
<script src="../shared/characters/rig.js"></script>
<script src="../shared/characters/person.js"></script>
<script src="../shared/characters/robot.js"></script>
<script>
  const stage = document.getElementById('stage');
  const tl = gsap.timeline({ paused: true });
  const div = (cls, css, html = '') => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); d.innerHTML = html; stage.appendChild(d); return d; };
  const add = (ch, x, ground, name, spec) => {
    stage.appendChild(ch.el); ch.place(x, ground);
    if (name) div('name', { left: x + 'px', top: ground + 18 + 'px' }, `<b>${name}</b>${spec ? `<span>${spec}</span>` : ''}`);
    return ch;
  };
  // head close-up card
  const card = (make, x, y, S, cap, expr, top = 22) => {
    const c = div('card', { left: x + 'px', top: y + 'px', width: S + 'px', height: S * 1.12 + 'px' });
    const W = S * 2.25, ch = make(W);
    c.appendChild(ch.el);
    Object.assign(ch.el.style, { left: S / 2 - W / 2 + 'px', top: -top * W / 400 + 'px' });
    ch.expr(tl, 0, expr);
    div('cap', { left: x + S / 2 + 'px', top: y + S * 1.12 + 10 + 'px' }, cap);
  };

  // ---- people ----
  div('sec', { left: '80px', top: '186px' }, '<b>会社員</b>OFFICE WORKERS — 6 PRESETS');
  const G1 = 640;
  div('floor', { left: '80px', width: '1010px', top: G1 + 'px' });
  const P = Chars.PEOPLE;
  const specs = { tanaka: 'part · regular · suit', suzuki: 'crop · slim · glasses', yamada: 'thin · stout · mustache', sato: 'bob · slim · skirt', kobayashi: 'long · slim · shirt', ito: 'crop · regular · shirt' };
  const ppl = Object.keys(P).map((k, i) => add(Chars.createPerson({ ...P[k], width: 215 }), 150 + i * 166, G1, P[k].name, specs[k]));
  ppl[0].pose(tl, 0, 'present', 'R');
  ppl[1].pose(tl, 0, 'raise', 'L').expr(tl, 0, 'happy');
  ppl[2].pose(tl, 0, 'hip', 'both').expr(tl, 0, 'deadpan');
  ppl[3].wave(tl, 0, { s: 'L', times: 0, keep: true }).expr(tl, 0, 'smile');
  ppl[4].expr(tl, 0, 'smile');
  ppl[5].pose(tl, 0, 'shrug', 'both').expr(tl, 0, 'worried');

  div('vline', { left: '1130px', top: '190px', height: '520px' });

  // ---- robots ----
  div('sec', { left: '1170px', top: '186px' }, '<b>汎用ロボット</b>COLOR VARIANTS');
  div('floor', { left: '1170px', width: '670px', top: G1 + 'px' });
  const cols = ['blue', 'red', 'green', 'yellow', 'purple', 'teal'];
  const robs = cols.map((c, i) => add(Chars.createRobot({ color: c, width: 215 }), 1222 + i * 118, G1, null));
  cols.forEach((c, i) => div('cap', { left: 1222 + i * 118 + 'px', top: G1 + 22 + 'px' }, c));
  robs[0].pose(tl, 0, 'wave', 'L', 0.01).expr(tl, 0, 'smile');
  robs[3].expr(tl, 0, 'happy');

  // ---- expressions ----
  div('rule thin', { top: '736px' });
  div('sec', { left: '80px', top: '756px' }, '<b>表情</b>EXPRESSIONS');
  ['normal', 'smile', 'happy', 'surprised', 'worried', 'serious', 'deadpan', 'calm'].forEach((e, i) =>
    card((w) => Chars.createPerson({ ...P.tanaka, width: w }), 80 + i * 128, 800, 112, e, e));
  div('vline', { left: '1130px', top: '770px', height: '260px' });
  ['normal', 'smile', 'happy', 'surprised', 'think', 'error'].forEach((e, i) =>
    card((w) => Chars.createRobot({ color: 'blue', width: w }), 1170 + i * 113, 800, 100, e, e, 84));

  tl.seek(1, false);
  document.fonts.ready.then(() => (window.__ready = true));
  window.seek = (t) => {};
</script>
</body>
</html>
